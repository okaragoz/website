# ============================================================
#  Content Manager configuration (Sveltia CMS / Decap-compatible)
#  Login is handled via GitHub OAuth — no server to maintain.
#  Replace OWNER/REPO below with your GitHub repository.
# ============================================================

backend:
  name: github
  repo: okaragoz/website
  branch: main
  # Sveltia CMS lets you sign in with a GitHub Personal Access Token
  # (Settings > Developer settings > Fine-grained tokens, repo: okaragoz/website,
  # Contents: Read and write) — no OAuth server needed for PAT login.

# Where uploaded images go (served from /images/...)
media_folder: "docs/public/images/uploads"
public_folder: "/images/uploads"

# Friendly editor experience
publish_mode: simple
site_url: https://okaragoz.com

collections:
  # ---------- Blog posts ----------
  - name: blog
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "docs/blog"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "blog/{{slug}}"
    filter: { field: category, value: blog }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD" }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: image, label: Feature image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: category, label: Category, widget: hidden, default: blog }
      - { name: layout, label: Layout, widget: hidden, default: post }
      # Raw mode: the article bodies carry figure components, and a
      # rich-text editor rewrites the HTML it does not recognise. Raw
      # keeps them intact, and the figure captions stay editable here
      # as ordinary text inside the caption="..." attribute.
      - { name: body, label: Body, widget: markdown, modes: ["raw"] }

  # ---------- Research writing ----------
  - name: research
    label: "Research Writing"
    label_singular: "Research Post"
    folder: "docs/research"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "research/{{slug}}"
    filter: { field: category, value: research }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD" }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: image, label: Feature image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false, default: ["research"] }
      - { name: category, label: Category, widget: hidden, default: research }
      - { name: layout, label: Layout, widget: hidden, default: post }
      # Raw mode: the article bodies carry figure components, and a
      # rich-text editor rewrites the HTML it does not recognise. Raw
      # keeps them intact, and the figure captions stay editable here
      # as ordinary text inside the caption="..." attribute.
      - { name: body, label: Body, widget: markdown, modes: ["raw"] }

  # ---------- Pages (one place: page content + the About markdown) ----------
  - name: pages
    label: "Pages"
    files:
      - name: about
        label: "About"
        file: "docs/about.md"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: "SEO description", widget: text }
          - { name: photo, label: "Photo (beside the intro text)", widget: image }
          - { name: photoAlt, label: "Photo — alt text", widget: string, required: false }
          # Layout flags. Declared so a CMS save keeps them — Sveltia/Decap drops
          # any frontmatter key the collection does not list. The page uses
          # VitePress's default `doc` layout, so `layout` is deliberately absent.
          - { name: aside, label: Aside, widget: hidden, default: false }
          - { name: pageClass, label: "Page class", widget: hidden, default: ok-wide }
          # Raw mode: the article bodies carry figure components, and a
      # rich-text editor rewrites the HTML it does not recognise. Raw
      # keeps them intact, and the figure captions stay editable here
      # as ordinary text inside the caption="..." attribute.
      - { name: body, label: Body, widget: markdown, modes: ["raw"] }
      # NB: research/index.md and publications.md just render Vue components; their
      # editable content is the JSON entries below (not markdown files). Listing one
      # file in two collections breaks Sveltia saves, so they are not file entries.
      - name: home
        label: "Home Page"
        file: "docs/.vitepress/data/home.json"
        description: "Hero text and the two section titles on the home page."
        fields:
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: titlePrefix, label: "Headline — before accent", widget: string }
          - { name: titleAccent, label: "Headline — accent word(s)", widget: string }
          - { name: titleSuffix, label: "Headline — after accent", widget: string }
          - { name: heroImage, label: "Hero photo", widget: image, hint: "The round portrait in the identity card. A square-ish crop works best." }
          - { name: heroImageAlt, label: "Hero photo — alt text", widget: string, required: false }
          - { name: tagline, label: "Tagline (under photo)", widget: text }
          - { name: ledeIntro, label: "Lede — intro line", widget: text }
          - { name: ledeBody, label: "Lede — body (muted)", widget: text }
          - { name: ctaPrimaryLabel, label: "Primary button label", widget: string }
          - { name: ctaPrimaryHref, label: "Primary button link", widget: string }
          - { name: ctaGhostLabel, label: "Secondary button label", widget: string }
          - { name: ctaGhostHref, label: "Secondary button link", widget: string }
          - { name: researchSectionTitle, label: "Research section title", widget: string }
          - { name: blogSectionTitle, label: "Blog section title", widget: string }
      - name: code_content
        label: "Code Page"
        file: "docs/.vitepress/data/code.json"
        description: "The Code section: MILEVA, MILET, and the community-code contributions."
        fields:
          - name: hero
            label: "Hero (top banner)"
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: lede, label: Lede, widget: text }
          - { name: intro, label: "Intro paragraph", widget: text }
          - name: projects
            label: "My codes"
            label_singular: "Code"
            widget: list
            fields:
              - { name: slug, label: "URL slug (/code/<slug>)", widget: string }
              - { name: name, label: Name, widget: string }
              - { name: logo, label: "Logo mark", widget: image, required: false }
              - { name: expansion, label: "What the name stands for", widget: string }
              - { name: tagline, label: Tagline, widget: string }
              - { name: accent, label: "Accent colour (hex)", widget: string }
              - { name: role, label: "Role badge", widget: string }
              - { name: summary, label: Summary, widget: text }
              - name: facts
                label: "Spec table"
                label_singular: Row
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: value, label: Value, widget: string }
              - { name: architecture, label: "How it is built", widget: text, required: false }
              - { name: run, label: "How it is run (code block)", widget: text, required: false }
              - { name: runNote, label: "Note under the code block", widget: text, required: false }
              # A list, not a single figure: the first is the lead figure on the
              # project page and both appear on the index card.
              - name: media
                label: "Lead figures"
                label_singular: Figure
                widget: list
                fields:
                  - { name: src, label: "File", widget: file }
                  - { name: type, label: Type, widget: select, options: ["image", "video", "gif"], default: image }
                  - { name: caption, label: Caption, widget: text }
                  - { name: w, label: "Width in pixels", widget: number, value_type: int }
                  - { name: h, label: "Height in pixels", widget: number, value_type: int }
                  # Declared so a CMS save keeps them. The figure pipeline sets
                  # these; dropping one puts a white box back on the dark theme.
                  - { name: cutout, label: "Transparent background (no frame)", widget: boolean, required: false, default: false }
                  - { name: invert, label: "Line art: flip the ink on dark", widget: boolean, required: false, default: false }
              - name: sections
                label: "Detail sections"
                label_singular: Section
                widget: list
                fields:
                  - { name: title, label: "Section title", widget: string }
                  - { name: items, label: "Bullet points", widget: list }
              - name: gallery
                label: "Example gallery"
                label_singular: Figure
                widget: list
                required: false
                fields:
                  - { name: src, label: "File", widget: file }
                  - { name: type, label: Type, widget: select, options: ["image", "video", "gif"], default: image }
                  - { name: caption, label: Caption, widget: text }
                  - { name: w, label: "Width in pixels", widget: number, value_type: int }
                  - { name: h, label: "Height in pixels", widget: number, value_type: int }
                  - { name: cutout, label: "Transparent background (no frame)", widget: boolean, required: false, default: false }
                  - { name: invert, label: "Line art: flip the ink on dark", widget: boolean, required: false, default: false }
              - { name: galleryColumns, label: "Gallery columns (1 for wide strips, 3 for square clips)", widget: number, value_type: int, required: false, default: 1 }
              - { name: examples, label: "Worked examples", widget: list }
              - name: links
                label: Links
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: URL, widget: string }
                  - { name: kind, label: Style, widget: select, options: ["primary", "ghost"] }
              - { name: citation, label: Citation, widget: text, required: false }
          - { name: contributionsTitle, label: "Community codes, title", widget: string }
          - { name: contributionsLede, label: "Community codes, lede", widget: text }
          - name: contributions
            label: "Community codes"
            label_singular: "Code"
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: lang, label: "Language / stack", widget: string }
              - { name: accent, label: "Accent colour (hex)", widget: string }
              - { name: desc, label: Description, widget: text }
              - { name: tags, label: Tags, widget: list }
      - name: lab_content
        label: "Lab Page"
        file: "docs/.vitepress/data/lab.json"
        description: "The analogue-modelling laboratory page: the experiments, the method sections, the apparatus and the crew."
        fields:
          - name: hero
            label: "Hero (top banner)"
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: lede, label: Lede, widget: text }
          - { name: intro, label: "Intro paragraph", widget: text }
          - name: facts
            label: "Spec table"
            label_singular: Row
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - name: leadFigure
            label: "Lead figure (beside the spec table)"
            widget: object
            required: false
            fields:
              - { name: src, label: "File", widget: file }
              - { name: type, label: Type, widget: select, options: ["image", "video", "gif"], default: image }
              - { name: caption, label: Caption, widget: text }
              - { name: w, label: "Width in pixels", widget: number, value_type: int }
              - { name: h, label: "Height in pixels", widget: number, value_type: int }
          - { name: experimentsTitle, label: "Experiments, section title", widget: string }
          - { name: experimentsLede, label: "Experiments, section lede", widget: text }
          - name: experiments
            label: "Experiments"
            label_singular: Experiment
            widget: list
            fields:
              - { name: id, label: "Anchor id (used in the URL)", widget: string }
              - { name: tag, label: "Tag badge", widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: items, label: "Bullet points", widget: list, required: false }
              - name: figures
                label: "Figures (right-hand column)"
                label_singular: Figure
                widget: list
                required: false
                fields:
                  - { name: src, label: "File", widget: file }
                  - { name: type, label: Type, widget: select, options: ["image", "video", "gif"], default: image }
                  - { name: caption, label: Caption, widget: text }
                  - { name: w, label: "Width in pixels", widget: number, value_type: int }
                  - { name: h, label: "Height in pixels", widget: number, value_type: int }
              - name: rig
                label: "Apparatus panel (optional)"
                widget: object
                required: false
                fields:
                  - { name: id, label: "Anchor id", widget: string, required: false }
                  - { name: name, label: "Apparatus name", widget: string }
                  - { name: role, label: "What it is for", widget: string, required: false }
                  - { name: body, label: Description, widget: text, required: false }
                  - name: specs
                    label: Specifications
                    label_singular: Row
                    widget: list
                    required: false
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: value, label: Value, widget: string }
                  - { name: figures, label: "Extra figures", widget: list, required: false }
                  - name: figure
                    label: "Photograph of the apparatus"
                    widget: object
                    required: false
                    fields:
                      - { name: src, label: "File", widget: file }
                      - { name: type, label: Type, widget: select, options: ["image", "video", "gif"], default: image }
                      - { name: caption, label: Caption, widget: text }
                      - { name: w, label: "Width in pixels", widget: number, value_type: int }
                      - { name: h, label: "Height in pixels", widget: number, value_type: int }
          - { name: methodTitle, label: "Method, section title", widget: string }
          - { name: methodLede, label: "Method, section lede", widget: text }
          - name: sections
            label: "Method sections"
            label_singular: Section
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: items, label: "Bullet points", widget: list, required: false }
              - name: figures
                label: "Figures (right-hand column)"
                label_singular: Figure
                widget: list
                required: false
                fields:
                  - { name: src, label: "File", widget: file }
                  - { name: type, label: Type, widget: select, options: ["image", "video", "gif"], default: image }
                  - { name: caption, label: Caption, widget: text }
                  - { name: w, label: "Width in pixels", widget: number, value_type: int }
                  - { name: h, label: "Height in pixels", widget: number, value_type: int }
              - name: rig
                label: "Apparatus panel (optional)"
                widget: object
                required: false
                fields:
                  - { name: id, label: "Anchor id", widget: string, required: false }
                  - { name: name, label: "Apparatus name", widget: string }
                  - { name: role, label: "What it is for", widget: string, required: false }
                  - { name: body, label: Description, widget: text, required: false }
                  - name: specs
                    label: Specifications
                    label_singular: Row
                    widget: list
                    required: false
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: value, label: Value, widget: string }
                  - { name: figures, label: "Extra figures", widget: list, required: false }
                  - name: figure
                    label: "Photograph of the apparatus"
                    widget: object
                    required: false
                    fields:
                      - { name: src, label: "File", widget: file }
                      - { name: type, label: Type, widget: select, options: ["image", "video", "gif"], default: image }
                      - { name: caption, label: Caption, widget: text }
                      - { name: w, label: "Width in pixels", widget: number, value_type: int }
                      - { name: h, label: "Height in pixels", widget: number, value_type: int }
          - { name: crewTitle, label: "Lab crew, section title", widget: string }
          - { name: crewLede, label: "Lab crew, section lede", widget: text }
          - { name: crewGroupLabel, label: "Group label above the names", widget: string, required: false }
          - name: crew
            label: "Lab crew"
            label_singular: "Member"
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
          - name: links
            label: Links
            widget: list
            required: false
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: URL, widget: string }
              - { name: kind, label: Style, widget: select, options: ["primary", "ghost"] }
      - name: news
        label: "News Banner"
        file: "docs/.vitepress/data/news.json"
        description: "The dismissible announcement banner on the home page."
        fields:
          - { name: show, label: "Show the banner", widget: boolean, default: true }
          - { name: tag, label: "Tag (bold prefix)", widget: string }
          - { name: text, label: "Message", widget: text }
          - { name: cta, label: "Button label (empty = no button)", widget: string, required: false }
          - { name: href, label: "Button link", widget: string, required: false }
      - name: publications_list
        label: "Publications List"
        file: "docs/.vitepress/data/publications.json"
        description: "The searchable publications table (peer-reviewed + abstracts)."
        fields:
          - name: peerReviewed
            label: "Articles & Preprints"
            label_singular: "Article"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: venue, label: Journal, widget: string }
              - { name: url, label: DOI / URL, widget: string }
              # Declared so a CMS save keeps the flag the generator sets.
              - { name: preprint, label: "Not yet peer-reviewed (preprint)", widget: boolean, required: false, default: false }
          - name: abstracts
            label: "Conference Abstracts"
            label_singular: "Abstract"
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: venue, label: Conference, widget: string }
              - { name: url, label: DOI / URL, widget: string }
      - name: research_content
        label: "Research Page Content"
        file: "docs/.vitepress/data/research.json"
        description: "Hero, workflow steps, disciplines, the three planet panels, and missions."
        fields:
          - { name: topics, label: "Topic keywords", widget: list, required: false }
          - name: hero
            label: "Hero (top banner)"
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: lede, label: Lede, widget: text }
              - { name: bg, label: "Background image", widget: image, required: false }
          - name: steps
            label: "Workflow steps"
            widget: object
            fields:
              - { name: title, label: "Section title", widget: string }
              - name: items
                label: Steps
                label_singular: Step
                widget: list
                fields:
                  - { name: n, label: "Number (01, 02, 03)", widget: string }
                  - { name: name, label: "Stage name", widget: string }
                  - { name: method, label: "What it consists of", widget: string }
                  - { name: body, label: Body, widget: text }
          - name: disciplines
            label: "Disciplines grid"
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: title, label: Title, widget: string }
              - { name: lede, label: Lede, widget: text }
              - name: items
                label: Disciplines
                label_singular: Discipline
                widget: list
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: "Role it plays", widget: string }
                  - { name: body, label: Body, widget: text }
                  - { name: worlds, label: "Worlds it applies to", widget: list }
          - name: methods
            label: "Approaches & Tools"
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: lede, label: Lede, widget: text }
              - name: items
                label: "Methods and codes"
                label_singular: "Method"
                widget: list
                fields:
                  - { name: label, label: "Category label", widget: string }
                  - { name: name, label: Name, widget: string }
                  - { name: own, label: "One of my own codes", widget: boolean, default: false }
                  - { name: badge, label: "Badge text", widget: string, required: false }
                  - { name: href, label: "Link (blank = not a link)", widget: string, required: false }
                  - { name: linkLabel, label: "Link label", widget: string, required: false }
                  - { name: desc, label: Description, widget: text }
          - name: codeBand
            label: "Code band (links to the Code section)"
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: lede, label: Lede, widget: text }
              - name: ctas
                label: Buttons
                label_singular: Button
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: URL, widget: string }
                  - { name: kind, label: Style, widget: select, options: ["primary", "ghost"], required: false }
          - name: planets
            label: "Planet panels"
            label_singular: "Planet"
            widget: list
            fields:
              - { name: symbol, label: "Symbol (e.g. ♀)", widget: string }
              - { name: name, label: "Name (Venus/Mars/Ganymede)", widget: string }
              - { name: accent, label: "Accent colour (hex)", widget: string }
              - { name: title, label: Title, widget: string }
              - { name: desc, label: Description, widget: text }
              # The planet artwork. Declared so a CMS save keeps it: Sveltia
              # drops any key the collection does not list, and dropping these
              # puts the three planet panels back to empty.
              - { name: image, label: "Planet image (transparent PNG/WebP)", widget: image, required: false }
              - { name: imageAlt, label: "Image, alt text", widget: string, required: false }
              - { name: imageCredit, label: "Image credit", widget: string, required: false }
              - { name: tabs, label: "Tab labels", widget: list, required: false }
              - name: subtopics
                label: Subtopics
                widget: list
                fields:
                  - { name: num, label: "Number / label", widget: string }
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Body, widget: text }
          - name: studies
            label: "In-depth studies"
            label_singular: "Study group"
            widget: list
            fields:
              - { name: planet, label: Planet, widget: string }
              - { name: accent, label: "Accent colour (hex)", widget: string }
              - { name: intro, label: Intro, widget: text }
              - name: items
                label: Studies
                widget: list
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Body, widget: text }
                  - { name: image, label: Image, widget: image, required: false }
                  - name: papers
                    label: Papers
                    widget: list
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: href, label: Link, widget: string }
          - name: missions
            label: "Planetary missions"
            label_singular: "Mission"
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: org, label: Organisation, widget: string }
              - { name: desc, label: Description, widget: text }

  # ---------- Site menu / navigation ----------
  - name: settings
    label: "Site Settings"
    files:
      - name: menu
        label: "Navigation Menu"
        file: "docs/.vitepress/data/menu.json"
        description: "Top navigation links. Order = display order."
        fields:
          - name: nav
            label: "Menu Items (mobile + fallback)"
            widget: list
            fields:
              - { name: text, label: Label, widget: string }
              - { name: link, label: Link, widget: string }
              # The drawer sub-items. Declared so a CMS save keeps them;
              # without this, saving the menu flattens Research and Code to
              # plain links on every phone.
              - name: items
                label: "Sub-items (drawer)"
                label_singular: "Sub-item"
                widget: list
                required: false
                fields:
                  - { name: text, label: Label, widget: string }
                  - { name: link, label: Link, widget: string }
          - name: mega
            label: "Desktop menu (with flyout panels)"
            label_singular: "Menu item"
            widget: list
            fields:
              - { name: text, label: Label, widget: string }
              - { name: link, label: Link, widget: string, required: false }
              - name: columns
                label: "Flyout columns (leave empty for a plain link)"
                label_singular: Column
                widget: list
                required: false
                fields:
                  - { name: title, label: "Column heading", widget: string }
                  - name: links
                    label: Links
                    widget: list
                    fields:
                      - { name: text, label: Label, widget: string }
                      - { name: link, label: Link, widget: string }
                      - { name: desc, label: Description, widget: string, required: false }
